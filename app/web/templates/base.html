<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ company }}{% endblock %}</title>
  <style>
    :root { --bg:#faf7f2; --fg:#1f2328; --muted:#5b6470; --accent:#b4572e; --err:#a4262c; --card:#fff; --line:#e3ddd3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16181b; --fg:#e8e6e3; --muted:#a2a9b1; --accent:#e08a5f; --err:#ff8a8f; --card:#1f2226; --line:#33373c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; margin: 2.5rem auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.5rem; }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    p.lede { color:var(--muted); margin:0 0 1.25rem; }
    label { display:block; font-weight:600; margin:.9rem 0 .3rem; }
    input, textarea { width:100%; padding:.6rem .7rem; border:1px solid var(--line); border-radius:6px;
      background:var(--bg); color:var(--fg); font:inherit; }
    textarea { min-height:7rem; resize:vertical; }
    button { margin-top:1.25rem; width:100%; padding:.75rem; border:0; border-radius:6px;
      background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
    .errors { color:var(--err); border:1px solid var(--err); border-radius:6px; padding:.5rem 1rem; }
    .hp { position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden; }
    small { color:var(--muted); }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
