[project]
name = "speed-to-lead"
version = "1.1.0"
description = "Lead capture, AI scoring, job queue, guarded follow-ups and an operator dashboard for a fictional home-services company."
requires-python = ">=3.11"
license = { text = "Proprietary - see LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
# Pinned dependencies live in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["T201"]
"app/demo/**" = ["S311"]  # seeded pseudo-random fake data, not security

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Starlette 1.x nudges toward httpx2 for TestClient; httpx 0.28 still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
