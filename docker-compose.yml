# Local stack: app + Postgres. Secrets come from your .env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speed_to_lead
      POSTGRES_USER: speed_to_lead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speed_to_lead -d speed_to_lead"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://speed_to_lead:${POSTGRES_PASSWORD}@db:5432/speed_to_lead
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://speed_to_lead:${POSTGRES_PASSWORD}@db:5432/speed_to_lead
    depends_on:
      app:
        condition: service_healthy  # the app container runs the migrations
    healthcheck:
      disable: true

volumes:
  pgdata:
